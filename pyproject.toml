[project]
name = "xueqiu-api"
version = "0.1.0.dev0"
description = "Python client for Xueqiu (雪球) and Danjuan market data: SDK, CLI and MCP server"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "liqiongyu" }]
requires-python = ">=3.11"
keywords = ["xueqiu", "snowball", "danjuan", "finance", "market-data", "mcp"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: Python :: Free Threading :: 2 - Beta",
    "Topic :: Office/Business :: Financial :: Investment",
    "Typing :: Typed",
]
dependencies = [
    "httpx2>=2.16,<3",
    "pydantic>=2.12,<3",
    "tzdata>=2025.2 ; sys_platform == 'win32'",
]

[project.scripts]
xueqiu = "xueqiu_api.cli:main"

[project.optional-dependencies]
mcp = ["mcp>=2.3,<3"]

[project.urls]
Homepage = "https://github.com/liqiongyu/xueqiu_api"
Issues = "https://github.com/liqiongyu/xueqiu_api/issues"

[build-system]
requires = ["uv_build>=0.12.11,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.0",
    "ruff>=0.17",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
allowed-confusables = ["，", "：", "；", "（", "）"]

[tool.ruff.lint.per-file-ignores]
"src/xueqiu_api/_endpoints_*.py" = ["E501"]

[tool.pyright]
include = ["src", "tests", "scripts/generate_client.py"]
pythonVersion = "3.11"
typeCheckingMode = "strict"
reportUnnecessaryTypeIgnoreComment = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers"]
markers = [
    "live: sends real requests to Xueqiu or Danjuan; opt-in only",
    "sample(name): the test parses a sample response of the named endpoint; checked at teardown",
]
